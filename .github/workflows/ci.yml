name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  app-build-and-ui-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          # Pick whichever iPhone simulator this runner image provides.
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -1)
          echo "Using simulator $UDID"
          xcodebuild test -scheme AccessibleNotes             -destination "id=$UDID"             CODE_SIGNING_ALLOWED=NO
